name: SayMoore
options:
  bundleIdPrefix: com.seemoretmoore
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "SayMoore Self-Sign"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      CODE_SIGN_IDENTITY: "SayMoore Self-Sign"

targets:
  SayMoore:
    type: application
    platform: macOS
    sources:
      - path: SayMoore
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: SayMoore/Resources
        excludes:
          - "Info.plist"
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seemoretmoore.saymoore
        PRODUCT_NAME: SayMoore
        INFOPLIST_FILE: SayMoore/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGNING_REQUIRED: YES
    dependencies:
      - framework: Vendor/whisper.xcframework
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Assert non-adhoc signing
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
          # Xcode 26 with empty DEVELOPMENT_TEAM skips app-bundle CodeSign; do it here.
          # Sign embedded bundles (e.g. test xctest under PlugIns/) first, then outer app.
          for sub in "$APP"/Contents/PlugIns/*.xctest "$APP"/Contents/Frameworks/*.framework; do
            [ -e "$sub" ] || continue
            codesign --force --sign "${CODE_SIGN_IDENTITY}" "$sub"
          done
          if ! codesign -dvv "$APP" 2>&1 | grep -q 'Authority=SayMoore Self-Sign'; then
            codesign --force --sign "${CODE_SIGN_IDENTITY}" "$APP"
          fi
          if codesign -dvv "$APP" 2>&1 | grep -qE 'flags=0x2\(adhoc\)|Signature=adhoc'; then
            echo "error: $APP is ad-hoc signed — TCC grants will not survive rebuild. Run scripts/setup-signing.sh and ensure Debug CODE_SIGN_IDENTITY=\"SayMoore Self-Sign\"." >&2
            exit 1
          fi
          codesign -dvv "$APP" 2>&1 | grep -q 'Authority=SayMoore Self-Sign' || {
            echo "error: expected Authority=SayMoore Self-Sign" >&2; exit 1; }
    scheme:
      testTargets:
        - SayMooreTests

  SayMooreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SayMooreTests
    dependencies:
      - target: SayMoore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seemoretmoore.saymoore.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SayMoore.app/Contents/MacOS/SayMoore"
